[build]
  command = "node generate-sitemap.js"
  publish = "."

[context.production.environment]
  NODE_VERSION = "18"

# --------------------------------------------------
# CANONICAL DOMAIN REDIRECTS
# --------------------------------------------------

[[redirects]]
  from = "https://physiodynamics.netlify.app/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://physio-dynamics.com/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://physio-dynamics.com/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.physio-dynamics.com/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

# --------------------------------------------------
# OLD URL REDIRECTS
# --------------------------------------------------

[[redirects]]
  from = "/ml/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ml"
  to = "/"
  status = 301
  force = true

