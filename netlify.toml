[build]
  command = "node generate-sitemap.js"
  publish = "."

[context.production.environment]
  NODE_VERSION = "18"

# --------------------------------------------------
# CANONICAL DOMAIN REDIRECTS
# --------------------------------------------------

[[redirects]]
  from = "https://physiodynamics.netlify.app/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://physio-dynamics.com/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://physio-dynamics.com/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.physio-dynamics.com/*"
  to = "https://www.physio-dynamics.com/:splat"
  status = 301
  force = true

# --------------------------------------------------
# OLD URL REDIRECTS
# --------------------------------------------------

[[redirects]]
  from = "/ml/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ml"
  to = "/"
  status = 301
  force = true

# --------------------------------------------------
# TRAILING SLASH REDIRECTS (fix Google Redirect errors)
# --------------------------------------------------

[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/services/"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/expert-profile/"
  to = "/expert-profile"
  status = 301
  force = true

[[redirects]]
  from = "/service/orthopedic-physiotherapy/"
  to = "/service/orthopedic-physiotherapy"
  status = 301
  force = true

[[redirects]]
  from = "/service/sports-physiotherapy/"
  to = "/service/sports-physiotherapy"
  status = 301
  force = true

[[redirects]]
  from = "/service/neurological-physiotherapy/"
  to = "/service/neurological-physiotherapy"
  status = 301
  force = true

[[redirects]]
  from = "/service/pediatric-physiotherapy/"
  to = "/service/pediatric-physiotherapy"
  status = 301
  force = true

[[redirects]]
  from = "/service/chest-physiotherapy/"
  to = "/service/chest-physiotherapy"
  status = 301
  force = true

[[redirects]]
  from = "/service/home-care/"
  to = "/service/home-care"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/"
  to = "/blogs"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/index"
  to = "/blogs"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/index.html"
  to = "/blogs"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/terms-of-service/"
  to = "/terms-of-service"
  status = 301
  force = true

# --------------------------------------------------
# REAL 404 (STATIC SITE)
# --------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# --------------------------------------------------
# SECURITY HEADERS
# --------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self' https: wss: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:;"

# Caching for Static Assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
