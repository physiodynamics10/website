<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0692ab"/>
      <stop offset="100%" stop-color="#03d0d8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#pdGradient)" filter="url(#shadow)"/>
  
  <!-- Stylized dynamic spine/movement curve & cross -->
  <path d="M 28 50 C 28 35, 42 26, 55 32 C 65 37, 72 48, 72 60 C 72 74, 58 80, 48 76 C 38 72, 34 60, 36 50" 
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Dynamic pulse dot -->
  <circle cx="50" cy="50" r="6" fill="#ffffff"/>
  
  <!-- Secondary accent arc -->
  <path d="M 62 28 A 20 20 0 0 1 76 46" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
</svg>
